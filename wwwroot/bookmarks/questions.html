<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101416">
  <title>Questions · BookmarkCounter</title>
  <link rel="stylesheet" href="/bookmarks/css/app.css?v=6">
  <script src="/bookmarks/js/questions.js?v=2" defer></script>
</head>
<body>
  <nav aria-label="MyNotes navigation" style="display:flex;gap:20px;flex-wrap:wrap;padding:12px 5vw;background:#20262b;font:14px Segoe UI,sans-serif"><a href="/journal" style="color:#eee">MyNotes journal</a></nav>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="BookmarkCounter home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M6 4.5h12v15l-6-4-6 4v-15Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span><span>Bookmark<span class="brand-light">Counter</span></span></a>
      <nav class="site-nav" aria-label="Main navigation"><a class="nav-link" href="/">Overview</a><a class="nav-link active" href="/bookmarks/questions" aria-current="page">Questions</a><a class="nav-link" href="/bookmarks/history">History <span aria-hidden="true">↗</span></a></nav>
    </header>
    <main class="questions-main">
      <div class="eyebrow"><span class="live-dot" aria-hidden="true"></span> Stay curious</div>
      <div class="history-heading"><div><h1>Questions</h1><p>Keep the things you wonder about here. They never expire.</p></div></div>
      <form class="question-form" id="newQuestionForm">
        <label for="newQuestion">What are you curious about?</label>
        <div class="question-compose"><input id="newQuestion" name="text" type="text" maxlength="500" placeholder="Write a question…" required><button class="primary-button" type="submit">Add question</button></div>
        <p class="form-error" id="newQuestionError" hidden></p>
      </form>
      <div class="question-section-heading"><h2>Unanswered</h2><span id="openCount">—</span></div>
      <div class="question-list" id="openQuestions" aria-live="polite"></div>
      <div class="question-section-heading"><h2>Answered</h2><span id="answeredCount">—</span></div>
      <div class="question-list" id="answeredQuestions" aria-live="polite"></div>
    </main>
    <footer class="site-footer">A calmer way to clear the queue.</footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
